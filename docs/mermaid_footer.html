<!-- shrink-array: draw the ```mermaid blocks of the Markdown pages. Doxygen
     prints them as code fragments; the ones that start with a Mermaid diagram
     keyword are handed to mermaid.js, loaded from a CDN. Offline, they stay
     readable as text. Regenerate the part above with `doxygen -w html` after a
     Doxygen upgrade, keeping this script. -->
<script type="module">
const kinds = /^(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|gantt|pie)\b/;
const blocks = [];
for (const frag of document.querySelectorAll('div.fragment')) {
  const lines = Array.from(frag.querySelectorAll('div.line'), (l) => l.textContent);
  if (lines.length && kinds.test(lines[0].trim())) {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = lines.join('\n');
    frag.replaceWith(pre);
    blocks.push(pre);
  }
}
if (blocks.length) {
  import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
    .then(({ default: mermaid }) => {
      mermaid.initialize({ startOnLoad: false });
      return mermaid.run({ nodes: blocks });
    })
    .catch(() => {});
}
</script>
