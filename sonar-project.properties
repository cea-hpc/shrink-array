#
# SonarQube Cloud (sonarcloud.io): what the scanner of .github/workflows/sonar.yml
# analyses. The C++ is read through the compilation database the workflow
# writes (sonar.cfamily.compile-commands, given on its command line): one
# entry per source file. scripts/sonar_export.py fetches the issues back.

sonar.organization=cea-hpc
sonar.projectKey=cea-hpc_shrink-array
sonar.projectName=shrink-array

sonar.sources=chunk,fast_allocators,examples,python,scripts
sonar.sourceEncoding=UTF-8
# The vendored headers (third_party/) are outside sonar.sources, but the C++
# analyser still reported issues in them through the includes (16 on the first
# analysis, ankerl and flat_hash_map): excluded, and their issues ignored.
sonar.exclusions=third_party/**

# Issues ignored, each with its reason (the triage of the first analysis,
# 2026-11-12). Rules that contradict a design decision, or that do not apply to
# what this repository is; not rules that found nothing yet.
sonar.issue.ignore.multicriteria=vendored,seqcst,mutable,coldlock,coldalloc,prng,brackets,agentpath,agentarg,agentcmd,agentconn,implicit1,implicit2,implicit3,implicit4,implicit5,valusing,nesting,cognitive,pycognitive,emptyfn,voidptr,manualmem,cmalloc,globals,protected,shcase,pystrings,lambdadef,lambdathis
# third_party/: vendored code, not ours to change.
sonar.issue.ignore.multicriteria.vendored.ruleKey=*
sonar.issue.ignore.multicriteria.vendored.resourceKey=third_party/**
# "Atomic operations should use sequential consistency": every memory order of
# the library is chosen and argued, and the lock-free handshakes are checked by
# the formal models (docs/formal_models.md, docs/synchronisation_dekker.md).
sonar.issue.ignore.multicriteria.seqcst.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.seqcst.resourceKey=**/*
# "Mutable data members should be protected by a mutex": the mutable members it
# flags are atomics, or check-build guards written by their own thread.
sonar.issue.ignore.multicriteria.mutable.ruleKey=cpp:S8379
sonar.issue.ignore.multicriteria.mutable.resourceKey=**/*
# The cold-path lock is recursive on purpose (rechunk_to() builds and destroys a
# temporary under it) and allocated once, never destroyed (a global array is
# torn down after main returns): internal/cold_path_lock.h. Same for the
# allocator's never-destroyed mutex.
sonar.issue.ignore.multicriteria.coldlock.ruleKey=cpp:S8462
sonar.issue.ignore.multicriteria.coldlock.resourceKey=**/cold_path_lock.h
sonar.issue.ignore.multicriteria.coldalloc.ruleKey=cpp:S8474
sonar.issue.ignore.multicriteria.coldalloc.resourceKey=**/*
# Pseudorandom generators in the examples and benchmarks make test data, not
# secrets.
sonar.issue.ignore.multicriteria.prng.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.prng.resourceKey=examples/**
# "[[" instead of "[" in shell scripts: style only.
sonar.issue.ignore.multicriteria.brackets.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.brackets.resourceKey=**/*
# "Agentic workflows" injections: python/ and scripts/ are command-line tools
# run by a person, with arguments that person types.
sonar.issue.ignore.multicriteria.agentpath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.agentpath.resourceKey=**/*
sonar.issue.ignore.multicriteria.agentarg.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.agentarg.resourceKey=**/*
sonar.issue.ignore.multicriteria.agentcmd.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.agentcmd.resourceKey=**/*
sonar.issue.ignore.multicriteria.agentconn.ruleKey=pythonsecurity:S8706
sonar.issue.ignore.multicriteria.agentconn.resourceKey=**/*
# "explicit" on one-argument constructors and conversion operators: in these
# files the implicit ones are the value interface -- T v = tab[i] and
# bool b = a[i] through the proxies and ElementRef, Bit <-> bool, the
# allocator's rebinding constructor (an allocator requirement), the
# AcquireValuesRef that stands for its T*. Each has its NOLINT or its comment.
sonar.issue.ignore.multicriteria.implicit1.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.implicit1.resourceKey=chunk/public/chunk/bit.h
sonar.issue.ignore.multicriteria.implicit2.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.implicit2.resourceKey=chunk/public/chunk/internal/element_ref.h
sonar.issue.ignore.multicriteria.implicit3.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.implicit3.resourceKey=chunk/public/chunk/internal/proxy_base.h
sonar.issue.ignore.multicriteria.implicit4.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.implicit4.resourceKey=chunk/public/chunk/internal/zero_proxy.h
sonar.issue.ignore.multicriteria.implicit5.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.implicit5.resourceKey=chunk/public/chunk/internal/parallel_storage_init.h
# Sonar way extended (2026-11-12): structure rules that contradict how the
# library is written, or that measure nothing useful here.
# Nesting depth and cognitive complexity: the hot paths are kept flat in one
# function on purpose (no indirection per element), and the handshakes read
# best as one sequence; the scripts and the GUI are tools, not a product.
sonar.issue.ignore.multicriteria.nesting.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.nesting.resourceKey=**/*
sonar.issue.ignore.multicriteria.cognitive.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.cognitive.resourceKey=**/*
sonar.issue.ignore.multicriteria.pycognitive.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.pycognitive.resourceKey=**/*
# Empty methods: the no-op specialisations of the policies (serial build, no
# compression, no checks) -- empty is what they mean.
sonar.issue.ignore.multicriteria.emptyfn.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.emptyfn.resourceKey=**/*
# void*, memory managed by hand, malloc/free: what an allocator and its
# low-level storage are made of (fast_allocators, the chunk buffers); the
# examples reproduce the legacy codes the library is for.
sonar.issue.ignore.multicriteria.voidptr.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.voidptr.resourceKey=**/*
sonar.issue.ignore.multicriteria.manualmem.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.manualmem.resourceKey=**/*
sonar.issue.ignore.multicriteria.cmalloc.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.cmalloc.resourceKey=**/*
# Non-const globals: thread_local rank caches, process-wide registries and
# atomics, each one argued where it is declared; in the examples, test state.
sonar.issue.ignore.multicriteria.globals.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.globals.resourceKey=**/*
# Protected members: the CRTP bases share their state with the derived chunk
# and array classes.
sonar.issue.ignore.multicriteria.protected.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.protected.resourceKey=**/*
# Style only: a shell case without a *) branch, a string repeated in a script.
sonar.issue.ignore.multicriteria.shcase.ruleKey=shell:S131
sonar.issue.ignore.multicriteria.shcase.resourceKey=**/*
sonar.issue.ignore.multicriteria.pystrings.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.pystrings.resourceKey=**/*
# Lambda captures: the [&] lambdas are passed to synchronous calls (chunk
# spans, team loops, run_slow_path) and run before the call returns, so a
# reference capture cannot dangle; the lambdas that outlive their scope (the
# deferred writes) already capture explicitly, by value; and the library has
# no [=] (no implicit this through a copy capture, deprecated in C++20).
sonar.issue.ignore.multicriteria.lambdadef.ruleKey=cpp:S3608
sonar.issue.ignore.multicriteria.lambdadef.resourceKey=**/*
sonar.issue.ignore.multicriteria.lambdathis.ruleKey=cpp:S5019
sonar.issue.ignore.multicriteria.lambdathis.resourceKey=**/*
# A using-directive in a harness's own header, inside that harness's namespace
# (validation::operators_validation): it reaches nothing else.
sonar.issue.ignore.multicriteria.valusing.ruleKey=cpp:S1003
sonar.issue.ignore.multicriteria.valusing.resourceKey=examples/validation/operators_validation_cases.h

# The cluster-side helpers run on Python 3.6 (login nodes), the rest on 3.9+.
sonar.python.version=3.6, 3.9, 3.12
