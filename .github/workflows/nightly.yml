#
# The nightly CI: the AArch64 builds too long for a push (ci.yml runs the
# AArch64 OpenMP check build there). Every night on develop, and on demand on
# any branch (workflow_dispatch). Two jobs on ubuntu-24.04-arm (4 Neoverse
# cores, 16 GB), gcc 14, with the check-mode switches:
#   - the std backend + oneTBB under ThreadSanitizer: the library's own
#     std::jthread team, the thread-rank registry and the TBB adaptor, seen by
#     TSan on the weak memory model (ci.yml runs the same on x86);
#   - the OpenMP _dyn build (run-time chunk sizes, 256 static next to it): the
#     re-chunk paths under threads (ci.yml builds _dyn serial only, on x86).
# On x86 (ubuntu-24.04): OpenMP under AddressSanitizer and under
# UndefinedBehaviorSanitizer, clang 23 with OpenMP and the OMPT tool, the
# oldest compilers supported (gcc 13, clang 18), the serial _dyn build, the
# Spack recipe installed from the checkout, and the line coverage of the
# library (gcov + gcovr: a report, not a gate).
# The C++23 and C++26 branches, which no push of develop builds: the ASan,
# UBSan and clang 23 jobs run on cpp23 too (a matrix over the branch), and
# cpp26 -- GCC 16 only (reflection, contracts) -- gets its own ASan and UBSan
# job in the gcc 16.2 image, as ci.yml's cpp26 job; no clang there.
# The options no other job turns on (x86-configs): second values indexed and
# the statistics, a Release without invariant checks at chunk size 1024,
# shared libraries with libc++ and -Werror.
# GenMC itself can join here when it is needed.

name: Nightly

on:
  schedule:
    # 03:17 UTC, every day: the runs are off the hour (GitHub's queue is
    # longest on the hour).
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A schedule runs on the default branch; the development is on develop.
  # A manual run takes the branch it was started from.
  NIGHTLY_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

# NB: a schedule runs the workflow file of the default branch (main): a change
# here reaches the nightly runs once it is merged into main.

jobs:
  # ThreadSanitizer on AArch64. No vm.mmap_rnd_bits sysctl here: the
  # address-space randomisation TSan refuses is the x86-64 runners' (ci.yml);
  # the AArch64 kernel's default fits TSan's 48-bit VA layout.
  arm-std-tsan:
    name: AArch64, std backend + TBB, ThreadSanitizer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev libtbb-dev
          g++-14 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_THREADS=std
          -DCHUNK_WITH_TBB=ON
          -DCHUNK_SANITIZER=thread
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=OFF
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check

  # The _dyn build under OpenMP on AArch64: the re-chunk paths
  # (rechunk_validation_*_dyn and the other _dyn harnesses) under threads; the
  # per-push CI builds _dyn serial only, on x86.
  arm-openmp-dyn:
    name: AArch64, OpenMP, _dyn
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev
          g++-14 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=ON
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check
      # No GenMC native runs here: they are C programs, the same in a _dyn build,
      # and ci.yml's AArch64 OpenMP job runs them on every push.

  # AddressSanitizer on x86, OpenMP: the second-value table's mmap
  # reservation, the reuse pools, the slab give-back, the re-chunk buffers --
  # out-of-bounds, use-after-free, double free and leaks at exit. The heavy
  # unity harnesses two at a time, as std-tsan (ci.yml).
  x86-openmp-asan:
    name: x86-64, OpenMP, AddressSanitizer (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The schedule: develop and cpp23; a manual run: its own branch.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","cpp23"]' || format('["{0}"]', github.ref_name)) }}
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      # print_module_map=1: the modules' load addresses in the report, so a faulting pc
      # of an inlined frame can be disassembled in the binary the failure step uploads.
      # dump_registers=1: the registers in a SEGV report (gcc 14's ASan prints none
      # by default), so a high-address fault shows which pointer was garbage.
      # disable_coredump=0: ASan turns core dumps off by default on 64 bits. Its shadow
      # stays out of the core (use_madv_dontdump, on by default). The report prints the
      # first faulting thread alone; the core has the stacks of all of them.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1:print_module_map=1:dump_registers=1:disable_coredump=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev
          g++-14 --version
          cmake --version
      # In the log: the runners differ, and a failure may be tied to one of their CPUs.
      - name: Runner CPU
        run: lscpu
      # The cores go to a directory of ours, not to apport (Ubuntu's core_pattern).
      - name: Core dumps
        run: |
          mkdir -p "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          -DCHUNK_SANITIZER=address
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=OFF
          -DCHUNK_X86_MARCH=x86-64-v3
      - name: Build and run the validation harnesses (check target)
        run: |
          ulimit -c unlimited
          cmake --build build --target check
      # The reader-vs-compression stress (read_reclaim_validation_*), many times over: a
      # race there shows once in tens of runs (one SEGV under ASan on 2026-11-02, in
      # zero_or_value's 8-thread case, not reproduced since). Stops at the first failure.
      - name: read_reclaim harnesses, repeated
        run: |
          ulimit -c unlimited
          ctest --test-dir build -R '^read_reclaim_validation_' --repeat until-fail:20 --timeout 600 --output-on-failure
      # On a failure, the validation executables (the faulting pc is an offset in one of
      # them: print_module_map above), for objdump -d around it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: asan-validation-binaries-${{ strategy.job-index }}
          path: build/examples/validation/validation_*_256
          retention-days: 14
      # The cores, for a closer look with the binary above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: asan-core-dumps-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cores
          if-no-files-found: ignore
          retention-days: 14
      # On the runner: elsewhere gdb lacks Ubuntu's libasan and libc, and stops at their frames.
      # The core's own name is cut at 15 characters; its execfn note has the full path.
      - name: Stacks of every thread, from the cores
        if: failure()
        run: |
          .github/apt_install.sh gdb
          for core in "$RUNNER_TEMP"/cores/core.*; do
            [ -e "$core" ] || continue
            exe=$(file "$core" | sed -n "s/.*execfn: '\\([^']*\\)'.*/\\1/p")
            echo "=== $core: $exe"
            gdb -nx -batch -iex 'set debuginfod enabled off' -ex 'thread apply all bt 30' "$exe" "$core" 2>&1 || true
          done

  # clang 23 (apt.llvm.org) with libstdc++ and libomp, OpenMP: the
  # diagnostics gcc does not give, and the OMPT tool (CHUNK_HAVE_OMPT), which
  # only a clang build has -- multi_mat's embedded-compression executable.
  x86-clang-openmp:
    name: x86-64, clang 23, OpenMP + OMPT (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The schedule: develop and cpp23; a manual run: its own branch.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","cpp23"]' || format('["{0}"]', github.ref_name)) }}
    env:
      CC: clang-23
      CXX: clang++-23
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Toolchain
        run: |
          wget --max-redirect=0 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          # libstdc++-14-dev: clang takes the newest libstdc++ installed.
          .github/apt_install.sh clang-23 libomp-23-dev libstdc++-14-dev ninja-build libbz2-dev
          clang++-23 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          -DCHUNK_USE_LIBCXX=OFF
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=OFF
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check
      - name: Examples (ctest -L examples)
        run: |
          cmake --build build --target getting_started simple_array_chunk multi_mat vectorisation_demo
          ctest --test-dir build -L examples --output-on-failure

  # The _dyn build on x86, serial, Release-like (RelWithDebInfo): the re-chunk
  # paths gated somewhere other than AArch64 OpenMP (arm-openmp-dyn) and the
  # coverage job (Debug, not a gate).
  x86-serial-dyn:
    name: x86-64, serial, _dyn
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev
          g++-14 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=OFF
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=ON
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check

  # The oldest compilers the library says it builds with (README, the Spack
  # recipe's conflicts): GCC 13 and Clang 18, both in ubuntu-24.04's own
  # archive. Every other job is gcc 14 or newer and clang 23: a C++20 construct
  # the old front ends lack would only be seen by a user.
  oldest-compilers:
    name: x86-64, ${{ matrix.name }}, OpenMP
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc 13
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
            cmake_args: ""
          # libstdc++ (CHUNK_USE_LIBCXX=OFF), as the clang 23 job; libomp 18.
          - name: clang 18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev
            cmake_args: -DCHUNK_USE_LIBCXX=OFF
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Toolchain
        run: |
          .github/apt_install.sh ${{ matrix.packages }} ninja-build libbz2-dev
          ${{ matrix.cxx }} --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          ${{ matrix.cmake_args }}
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=OFF
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check
      # Clang 18 + Ubuntu's libomp: the runtime has never loaded the library's
      # OMPT tool here ("the OpenMP runtime did not load it"), where clang 23's
      # does. Which libomp the harness loads, whether it is linked with
      # -Bsymbolic*, whether the harness exports ompt_start_tool, and the
      # runtime's own account of its tool search (OMP_TOOL_VERBOSE_INIT).
      - name: OMPT tool discovery (diagnostic)
        if: always() && startsWith(matrix.cc, 'clang')
        run: |
          # The harness's command as ctest runs it (one executable per group).
          read -r exe harness < <(ctest --test-dir build -N -V -R '^mark_path_validation_zero_256_1thr$' \
                                  | sed -n 's/.*Test command: //p' | tr -d '"' | head -1)
          echo "harness: $exe $harness"
          [ -n "$exe" ] || exit 0
          ldd "$exe" | grep -i omp || true
          lib=$(ldd "$exe" | awk '/libomp/ {print $3; exit}')
          echo "--- $lib"
          readelf -d "$lib" | grep -iE 'soname|flags|symbolic' || true
          nm -D "$lib" | grep -E 'ompt_start_tool' || true
          echo "--- $exe"
          nm -D "$exe" | grep -E 'ompt_start_tool|g_ompt_suspended' || echo "ompt_start_tool not in the dynamic symbol table"
          OMP_TOOL_VERBOSE_INIT=stdout OMP_NUM_THREADS=1 "$exe" $harness 2>&1 | head -40 || true
      - name: Examples (ctest -L examples)
        run: |
          cmake --build build --target getting_started simple_array_chunk multi_mat vectorisation_demo
          ctest --test-dir build -L examples --output-on-failure

  # UndefinedBehaviorSanitizer (CHUNK_SANITIZER=undefined), OpenMP: signed overflow in
  # the index arithmetic, shifts, misaligned accesses, out-of-range conversions.
  # The first report stops the program (-fno-sanitize-recover in the build).
  # A fixed -march, as the ASan job: the binary does not depend on the runner.
  # The unity harnesses one at a time (the heavy pool): instrumented, one of
  # them takes more than 7 GB to compile.
  x86-openmp-ubsan:
    name: x86-64, OpenMP, UndefinedBehaviorSanitizer (${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The schedule: develop and cpp23; a manual run: its own branch.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","cpp23"]' || format('["{0}"]', github.ref_name)) }}
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev
          g++-14 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          -DCHUNK_SANITIZER=undefined
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=ON
          -DCHUNK_X86_MARCH=x86-64-v3
          -DCMAKE_JOB_POOLS=heavy=1
          -DCHUNK_HEAVY_JOB_POOL=heavy
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check

  # The build options no other job turns on (develop only), each entry a
  # build of its own with the check target:
  #  - zero_any's second values as 4-byte identifiers (CHUNK_SECOND_VALUE_INDEXED)
  #    and the compression statistics (CHUNK_STATS), check-mode;
  #  - a Release without the invariant checks (no CHECK_OPTIM: what users
  #    build), chunk size 1024 -- the harnesses forced in
  #    (CHUNK_BUILD_VALIDATION, which Release leaves out by default);
  #  - shared libraries (BUILD_SHARED_LIBS), libc++ and -Werror: clang 23,
  #    Debug, since CHUNK_WERROR applies to Debug builds only.
  x86-configs:
    name: x86-64, ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenMP, second values indexed + stats
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
            build_type: RelWithDebInfo
            cmake_args: -DCHUNK_OPENMP=ON -DCHUNK_CHECK_OPTIM=ON -DCHUNK_SECOND_VALUE_INDEXED=ON -DCHUNK_STATS=ON -DCHUNK_STATIC_SIZES=256
          - name: OpenMP, Release without invariant checks, 1024
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
            build_type: Release
            cmake_args: -DCHUNK_OPENMP=ON -DCHUNK_BUILD_VALIDATION=ON -DCHUNK_STATIC_SIZES=1024
          - name: clang 23, libc++, shared libraries, -Werror (Debug)
            cc: clang-23
            cxx: clang++-23
            packages: clang-23 libc++-23-dev libc++abi-23-dev libomp-23-dev
            llvm: true
            build_type: Debug
            cmake_args: -DCHUNK_OPENMP=ON -DCHUNK_USE_LIBCXX=ON -DBUILD_SHARED_LIBS=ON -DCHUNK_WERROR=ON -DCHUNK_STATIC_SIZES=256
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: apt.llvm.org
        if: matrix.llvm
        run: |
          wget --max-redirect=0 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
      - name: Toolchain
        run: |
          .github/apt_install.sh ${{ matrix.packages }} ninja-build libbz2-dev
          ${{ matrix.cxx }} --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.cmake_args }}
          -DCHUNK_BUILD_DYN=OFF
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check

  # cpp26 under the sanitizers: GCC 16 in the gcc 16.2 image (ci.yml's cpp26
  # job), OpenMP, the same switches as the x86 ASan and UBSan jobs above.
  # SYS_PTRACE: LeakSanitizer stops the threads with ptrace, which Docker's
  # default profile refuses. No core dumps (no sysctl in a container).
  cpp26-sanitizers:
    # the schedule, and a manual run from develop (which tests this file) or cpp26
    if: github.event_name == 'schedule' || github.ref_name == 'develop' || github.ref_name == 'cpp26'
    name: x86-64, gcc 16, cpp26, OpenMP, ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      # pinned by digest, as ci.yml's cpp26 job (gcc:16.2.0-trixie on 2026-11-19)
      image: gcc:16.2.0-trixie@sha256:5c2f83335c97e233c80d2bc754bd5c46b2d9c32f236a765a4ac40a59f216c064
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            cmake_args: -DCHUNK_SANITIZER=address -DCHUNK_BUILD_DYN=OFF
          # instrumented, a unity harness takes more than 7 GB: one at a time
          - name: UndefinedBehaviorSanitizer
            cmake_args: -DCHUNK_SANITIZER=undefined -DCHUNK_BUILD_DYN=ON -DCMAKE_JOB_POOLS=heavy=1 -DCHUNK_HEAVY_JOB_POOL=heavy
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1:print_module_map=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cpp26
      - name: Toolchain
        run: |
          apt-get update -q
          apt-get install -y -q cmake ninja-build libbz2-dev
          g++ --version
          cmake --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCHUNK_OPENMP=ON
          ${{ matrix.cmake_args }}
          -DCHUNK_CHECK_OPTIM=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_X86_MARCH=x86-64-v3
      - name: Build and run the validation harnesses (check target)
        run: cmake --build build --target check

  # The Spack recipe (spack/spack_repo/shrink_array), on the commit under test:
  # an environment whose shrink-array@develop is this checkout (spack develop),
  # installed for target=x86_64_v3 with the runner's own gcc, cmake and make.
  # It checks what the recipe promises: it concretizes and installs, the build
  # took no target flag from the project (the spec's target is the wrapper's to
  # pass), and a user project finds the installed package.
  # Spack is pinned to a release; its package repository is fetched at first use.
  spack:
    name: Spack recipe (install, target=x86_64_v3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPACK_REF: v1.0.4
      SPACK_USER_CONFIG_PATH: ${{ github.workspace }}/.spack-config
      SPACK_USER_CACHE_PATH: ${{ github.workspace }}/.spack-cache
      SPACK_DISABLE_LOCAL_CONFIG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Spack
        run: |
          git clone --quiet --depth 1 --branch "$SPACK_REF" https://github.com/spack/spack.git "$RUNNER_TEMP/spack"
          . "$RUNNER_TEMP/spack/share/spack/setup-env.sh"
          spack --version
          spack compiler find
          spack external find --not-buildable cmake gmake
          spack repo add spack/spack_repo/shrink_array
          spack info shrink-array
      - name: Concretize and install this checkout
        run: |
          . "$RUNNER_TEMP/spack/share/spack/setup-env.sh"
          spack env create -d "$RUNNER_TEMP/env"
          spack -e "$RUNNER_TEMP/env" add "shrink-array@develop sizes=256 ~dyn target=x86_64_v3"
          spack -e "$RUNNER_TEMP/env" develop --path "$GITHUB_WORKSPACE" shrink-array@develop
          spack -e "$RUNNER_TEMP/env" concretize
          spack -e "$RUNNER_TEMP/env" install -j 2
      # The project added no -march of its own: its configure says so, and the
      # libraries hold no AVX-512 instruction (zmm), which -march=native puts
      # there on the runners that have it and x86_64_v3 does not allow.
      - name: The target is the spec's
        run: |
          . "$RUNNER_TEMP/spack/share/spack/setup-env.sh"
          prefix=$(spack -e "$RUNNER_TEMP/env" location -i shrink-array)
          zcat -f "$prefix"/.spack/spack-build-out.txt* | grep -F "Target flags: none"
          for lib in "$prefix"/lib/*.a; do
            zmm=$(objdump -d "$lib" | grep -c zmm || true)
            echo "$(basename "$lib"): $zmm zmm"
            [ "$zmm" -eq 0 ]
          done
      - name: getting_started against the Spack install
        run: |
          . "$RUNNER_TEMP/spack/share/spack/setup-env.sh"
          prefix=$(spack -e "$RUNNER_TEMP/env" location -i shrink-array)
          cmake -S examples/getting_started -B build-gs -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-gs
          OMP_NUM_THREADS=4 ./build-gs/getting_started

  # Line coverage of chunk/ and fast_allocators/ by the validation harnesses:
  # Debug (-O0, the lines map to the source), OpenMP, 256 + _dyn, gcc 14
  # --coverage. A report, not a gate: the tests step may fail (under -O0 +
  # gcov the longest checks -- shrink_bench_*_check, the scale-64-to-tgt
  # re-chunks -- pass 10 minutes; a test killed on its timeout writes no
  # .gcda, its lines read uncovered), the report is made all the same.
  # --merge-lines folds the template instances of a line into one (else a line
  # counts once per instance); the function count stays per instance.
  # The summary goes to the run page, the HTML (per file, nested) to an
  # artifact.
  coverage:
    name: x86-64, OpenMP, coverage (gcov)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Toolchain
        run: |
          .github/apt_install.sh g++-14 ninja-build libbz2-dev
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install -q gcovr==8.8
          g++-14 --version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=--coverage -fprofile-update=atomic -DCHUNK_GCOV_DUMP"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DCHUNK_OPENMP=ON
          -DCHUNK_STATIC_SIZES=256
          -DCHUNK_BUILD_DYN=ON
      - name: Build
        run: cmake --build build
      - name: Validation harnesses
        continue-on-error: true
        run: ctest --test-dir build -j4 -LE examples --timeout 1800 --output-on-failure
      # The traces' own paths: the size predictor (chunk_size_predictor.h, at
      # every zero_any clear() with advisor=info in a check build) and the
      # compression residual's chunk sample (compress=info) run only when
      # their channel is at info, which no harness asks for: 0 % in the report.
      # A second pass of two quick harness families with those channels on adds
      # their counters to the first pass's: compress_roundtrip_validation reaches the
      # predictor, bulk_write_team_validation a residual. Not the whole suite,
      # whose log-reading tests (log_validation) set CHUNK_LOG themselves.
      - name: Harnesses with the advisor and compress traces on
        continue-on-error: true
        env:
          CHUNK_LOG: warn,advisor=info,compress=info
        run: ctest --test-dir build -j4 -R '^(compress_roundtrip_validation|bulk_write_team_validation)_' --timeout 1800 --output-on-failure
      - name: Coverage report
        if: always()
        run: |
          mkdir -p coverage sonar
          "$RUNNER_TEMP/gcovr/bin/gcovr" -r . build --gcov-executable gcov-14 -j4 \
            --merge-lines --merge-mode-functions=separate \
            --filter 'chunk/' --filter 'fast_allocators/' \
            --gcov-ignore-errors=no_working_dir_found --gcov-ignore-parse-errors=all \
            --markdown coverage/coverage.md --html-nested coverage/index.html --txt-summary \
            --sonarqube sonar/coverage.xml
          cat coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > sonar/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
      # The same counters in SonarQube's generic coverage format, with the
      # commit they measure: sonar.yml's analyses take the latest one (a
      # 3-hour coverage run per push would hold every analysis that long).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-sonarqube
          path: sonar/
          retention-days: 14
